<html lang="pt-BR">

<meta name="description" content="Responda algumas perguntas rápidas e descubra o caminho certo para a sua aprovação no próximo ENEM." />

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f5efe4;
    --bg-2: #efe8db;
    --orange: #e23b34;
    --orange-2: #f0533f;
    --text: #1a1a1a;
    --muted: #6e6862;
    --muted-2: #a39c93;
    --line: rgba(0, 0, 0, 0.10);
    --card: #fffdf9;
    --card-border: rgba(226, 59, 52, 0.22);
    --maxw: 640px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background:
      radial-gradient(900px 480px at 50% -8%, rgba(226,59,52,0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, sans-serif;
    line-height: 1.6;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 500; line-height: 1.15; letter-spacing: -0.01em; }

  .em { color: var(--orange); }

  /* progress bar top */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--orange);
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 11px 16px;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.92);
  }
  .topbar .track { width: 180px; height: 5px; border-radius: 4px; background: rgba(255,255,255,0.28); overflow: hidden; }
  .topbar .track i { display: block; height: 100%; width: 12%; background: #fff; border-radius: 4px; transition: width .4s cubic-bezier(.4,0,.2,1); }
  .topbar .pct { color: #fff; font-weight: 700; min-width: 34px; text-align: right; }

  main {
    flex: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 46px 22px 60px;
  }

  .quiz {
    width: 100%;
    max-width: var(--maxw);
  }

  /* each step */
  .step { display: none; animation: fade .45s ease both; }
  .step.active { display: block; }

  @keyframes fade {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .step-num {
    font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--orange); font-weight: 600; margin-bottom: 16px;
  }

  .question {
    font-size: clamp(26px, 6vw, 36px);
    margin-bottom: 6px;
  }

  .sub {
    color: var(--muted); font-size: 15px; margin-bottom: 30px;
  }

  .options { display: flex; flex-direction: column; gap: 12px; }

  .opt {
    display: flex; align-items: center; gap: 14px;
    width: 100%; text-align: left;
    background: var(--card);
    border: 1.5px solid var(--card-border);
    border-radius: 15px;
    padding: 18px 20px;
    font-family: inherit; font-size: 16px; font-weight: 500; color: var(--text);
    cursor: pointer;
    transition: transform .15s ease, border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .opt:hover {
    border-color: var(--orange);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px -14px rgba(226,59,52,0.5);
  }
  .opt:active { transform: translateY(0); }
  .opt.selected {
    border-color: var(--orange);
    background: rgba(226,59,52,0.06);
    box-shadow: 0 10px 24px -14px rgba(226,59,52,0.55);
  }

  .opt .dot {
    flex: 0 0 auto;
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--card-border);
    position: relative; transition: border-color .15s ease;
  }
  .opt:hover .dot, .opt.selected .dot { border-color: var(--orange); }
  .opt.selected .dot::after {
    content: ""; position: absolute; inset: 3px; border-radius: 50%;
    background: var(--orange);
  }

  .nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 30px;
  }
  .back {
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 4px;
  }
  .back:hover { color: var(--text); }
  .back[hidden] { visibility: hidden; }

  .hint { font-size: 13px; color: var(--muted-2); }

  /* result screen */
  .result { text-align: center; padding-top: 10px; }
  .result .check {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--orange); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; margin: 0 auto 24px;
    box-shadow: 0 16px 34px -16px rgba(226,59,52,0.7);
  }
  .result h2 { font-size: clamp(28px, 7vw, 40px); margin-bottom: 14px; }
  .result p { color: var(--muted); font-size: 16px; max-width: 460px; margin: 0 auto 30px; }

  .cta {
    display: inline-block;
    background: var(--orange);
    color: #fff; text-decoration: none;
    font-family: inherit; font-size: 17px; font-weight: 700;
    padding: 17px 40px; border-radius: 40px;
    box-shadow: 0 16px 30px -14px rgba(226,59,52,0.75);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .cta:hover { transform: translateY(-2px); box-shadow: 0 20px 36px -14px rgba(226,59,52,0.85); }

  .loader { text-align: center; padding: 40px 0; }
  .spinner {
    width: 44px; height: 44px; margin: 0 auto 22px;
    border: 4px solid rgba(226,59,52,0.2);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader p { color: var(--muted); font-size: 15px; }

  footer {
    text-align: center; padding: 22px; font-size: 12px; color: var(--muted-2);
  }

  @media (max-width: 480px) {
    .opt { padding: 16px 16px; font-size: 15px; }
    .topbar .track { width: 120px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <span>Seu plano</span>
    <span class="track"><i id="bar"></i></span>
    <span class="pct" id="pct">0%</span>
  </div>

  <main>
    <form class="quiz" id="quiz" autocomplete="off">
      <!-- steps injected by JS -->
    </form>
  </main>

  <footer>Workshop 100 Dias para o ENEM · Renato Palmeira</footer>

<script>
  // ---- Config: destino final após responder ----
  var FINAL_URL = "index.html"; // troque pela sua página de oferta/checkout se quiser

  var QUESTIONS = [
    {
      key: "idade",
      tag: "01 · Idade",
      title: "Qual a sua idade?",
      options: ["Menos de 18 anos", "18 a 24 anos", "25 a 30 anos", "Mais de 30 anos"]
    },
    {
      key: "promessa",
      tag: "02 · Seu objetivo",
      title: "Você quer passar em Medicina (ou no curso dos seus sonhos) já no próximo ENEM?",
      options: ["Sim", "Não"]
    },
    {
      key: "dor",
      tag: "03 · Onde você trava",
      title: "Qual dessas frases mais tem a ver com você hoje?",
      options: [
        "Estudo, mas sinto que não sei estudar do jeito certo",
        "Me perco no tanto de conteúdo e não sei por onde começar",
        "Sei o que preciso fazer, mas não mantenho a constância",
        "Estudo bastante, mas minha nota não sai do lugar"
      ]
    },
    {
      key: "urgencia",
      tag: "04 · Urgência",
      title: "Quando você quer resolver isso?",
      options: [
        "Agora — a prova está chegando e não posso perder tempo",
        "Posso esperar um pouco",
        "Tanto faz"
      ]
    },
    {
      key: "desejo",
      tag: "05 · Sua motivação",
      title: "Por que passar é tão importante pra você?",
      options: [
        "É o sonho da minha vida e não vou desistir",
        "Quero provar (pra mim e pra todos) que sou capaz",
        "Quero dar uma vida melhor pra minha família",
        "Quero a estabilidade que a Medicina traz",
        "Sinceramente, tanto faz passar agora ou depois"
      ]
    },
    {
      key: "renda",
      tag: "06 · Renda familiar",
      title: "Qual a renda aproximada da sua família?",
      options: [
        "Até 2 mil",
        "Entre 2 e 5 mil",
        "Entre 5 e 8 mil",
        "Entre 8 e 10 mil",
        "Mais de 10 mil"
      ]
    },
    {
      key: "investimento",
      tag: "07 · Investimento já feito",
      title: "Quanto você já investiu na sua aprovação (cursinho, materiais, mentorias)?",
      options: [
        "Nunca investi nada",
        "Até R$ 1.000",
        "De R$ 1.000 a R$ 3.000",
        "De R$ 3.000 a R$ 5.000",
        "Mais de R$ 5.000"
      ]
    },
    {
      key: "pagamento",
      tag: "08 · Forma de pagamento",
      title: "Quando você investe em algo importante, como costuma pagar?",
      options: ["Cartão de crédito", "Pix", "Boleto", "Não costumo investir"]
    }
  ];

  var quiz = document.getElementById("quiz");
  var bar = document.getElementById("bar");
  var pct = document.getElementById("pct");
  var answers = {};
  var current = 0;
  var total = QUESTIONS.length;

  // Build all question steps
  QUESTIONS.forEach(function (q, i) {
    var step = document.createElement("section");
    step.className = "step";
    step.dataset.index = i;

    var opts = q.options.map(function (label, j) {
      return (
        '<button type="button" class="opt" data-value="' + escapeAttr(label) + '">' +
          '<span class="dot"></span><span>' + label + "</span>" +
        "</button>"
      );
    }).join("");

    step.innerHTML =
      '<div class="step-num">' + q.tag + "</div>" +
      '<h1 class="question">' + q.title + "</h1>" +
      '<p class="sub">Escolha a opção que mais combina com você.</p>' +
      '<div class="options">' + opts + "</div>" +
      '<div class="nav">' +
        '<button type="button" class="back">← Voltar</button>' +
        '<span class="hint">Pergunta ' + (i + 1) + " de " + total + "</span>" +
      "</div>";

    quiz.appendChild(step);
  });

  // Result step
  var result = document.createElement("section");
  result.className = "step";
  result.id = "result-step";
  result.innerHTML =
    '<div class="loader" id="loader">' +
      '<div class="spinner"></div>' +
      "<p>Montando o seu plano dos 100 dias...</p>" +
    "</div>" +
    '<div class="result" id="result" style="display:none">' +
      '<div class="check">✓</div>' +
      "<h2>Prontinho! Seu perfil foi montado.</h2>" +
      "<p>Com base nas suas respostas, o Workshop 100 Dias é o caminho certo para você chegar na prova com um plano na mão. Bora dar o próximo passo?</p>" +
      '<a class="cta" id="finalCta" href="' + FINAL_URL + '">Quero meu plano dos 100 dias →</a>' +
    "</div>";
  quiz.appendChild(result);

  var steps = quiz.querySelectorAll(".step");

  // Delegated clicks
  quiz.addEventListener("click", function (e) {
    var opt = e.target.closest(".opt");
    if (opt) return selectOption(opt);

    var back = e.target.closest(".back");
    if (back) return goBack();
  });

  function selectOption(opt) {
    var step = opt.closest(".step");
    var i = Number(step.dataset.index);
    var q = QUESTIONS[i];

    step.querySelectorAll(".opt").forEach(function (o) { o.classList.remove("selected"); });
    opt.classList.add("selected");

    answers[q.key] = opt.dataset.value;

    if (typeof fbq === "function") {
      fbq("trackCustom", "QuizAnswer", { step: i + 1, key: q.key, value: opt.dataset.value });
    }

    // small delay so the selection is visible, then advance
    setTimeout(function () {
      if (i + 1 < total) {
        goTo(i + 1);
      } else {
        finish();
      }
    }, 260);
  }

  function goBack() {
    if (current > 0) goTo(current - 1);
  }

  function goTo(index) {
    steps[current].classList.remove("active");
    current = index;
    var step = steps[current];
    step.classList.add("active");

    var back = step.querySelector(".back");
    if (back) back.hidden = current === 0;

    updateProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function updateProgress() {
    var p = Math.round((current / total) * 100);
    bar.style.width = Math.max(p, 6) + "%";
    pct.textContent = p + "%";
  }

  function finish() {
    // go to result step
    steps[current].classList.remove("active");
    current = total; // result index
    var rstep = document.getElementById("result-step");
    rstep.classList.add("active");
    bar.style.width = "100%";
    pct.textContent = "100%";
    window.scrollTo({ top: 0, behavior: "smooth" });

    // persist answers
    try { localStorage.setItem("quiz100dias", JSON.stringify(answers)); } catch (err) {}

    if (typeof fbq === "function") {
      fbq("trackCustom", "QuizComplete", answers);
    }

    // fake "processing" then show result
    setTimeout(function () {
      document.getElementById("loader").style.display = "none";
      document.getElementById("result").style.display = "block";
      // carrega os UTMs / query params na CTA final
      var cta = document.getElementById("finalCta");
      if (window.location.search) {
        cta.href = FINAL_URL + window.location.search;
      }
    }, 1600);
  }

  function escapeAttr(s) {
    return String(s).replace(/"/g, "&quot;");
  }

  // init
  steps[0].classList.add("active");
  steps[0].querySelector(".back").hidden = true;
  updateProgress();
</script>
</body>
</html>
